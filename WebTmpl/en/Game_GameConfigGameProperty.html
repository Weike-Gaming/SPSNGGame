
<script>
	var _isWaitingForSavingGameProperty = false;
	var _isWaitingForAbortSavingGameProperty = false;
	
	$(document).ready
	(
		function()
		{
			var formValues = $('form[name={% BLOCK GAMEDETAIL %}]').serialize();
			var formParent = $('form[name={% BLOCK GAMEDETAIL %}]');
			
			function canSaveGameProperty()
			{
				if(!_isWaitingForSavingGameProperty && !_isWaitingForAbortSavingGameProperty)
				{
					_isWaitingForSavingGameProperty = true;
					formParent.find("#btnSave").text("ABORT");
					$('input[name="PostAction"]').val('Abort');
					
					var bSoftMasterReset = convertIntStringToHexString(0, 1);
					var sramStartAddress = convertIntStringToHexString(KEY_SRAM_START_INDEX, 2);
					// IMPORTANT: number of configuration (in byte data type) to save
					var numOfConfigInByteToSave = convertIntStringToHexString(6, 1);
					var enableAutoTakeWinIndex = convertIntStringToHexString(formParent.find('#enableAutoTakeWin').val(), 1);
					var enableFastStopIndex = convertIntStringToHexString(formParent.find('#enableFastStop').val(), 1);
					var enableAutoSpinIndex = convertIntStringToHexString(formParent.find('#enableAutoSpin').val(), 1);
					let enableLatch = convertIntStringToHexString(formParent.find('#enableLatch').val(), 1);
					var enableFastStopInFeatureIndex = convertIntStringToHexString(formParent.find('#enableFastStopInFeature').val(), 1);
					var enableAllowPreanimationIndex = convertIntStringToHexString(formParent.find('#enableAllowPreanimation').val(), 1);
					
					updateContentPageElements(true, 'btnSave', '');
					updateNavBarElements(true);
					updateTabElements(true);
					
					$.post
					("saveGameProperty", 
						{
							gameProperty:bSoftMasterReset + sramStartAddress + numOfConfigInByteToSave + enableAutoTakeWinIndex + enableFastStopIndex + enableAutoSpinIndex + enableLatch + enableFastStopInFeatureIndex + enableAllowPreanimationIndex,
						},
						function(data)
						{
						}
					);
				}
						
			}
				
			formParent.find("#btnSave").click
			(
				function()
				{
					// Do not perform saving procedure if there is no changes
					if(formValues == $('form[name={% BLOCK GAMEDETAIL %}]').serialize()) 
						return false;
						
					if(_isWaitingForSavingGameProperty && !_isWaitingForAbortSavingGameProperty)
					{
						_isWaitingForSavingGameProperty = false;
						_isWaitingForAbortSavingGameProperty = true;
						
						$.post
						("abortSavingGameProperty", 
							{
								gameProperty:"00"
							},
							function(data)
							{
								_isWaitingForAbortSavingGameProperty = false;
								formParent.find("#btnSave").text("SAVE");
								$('input[name="PostAction"]').val('Save');
								updateContentPageElements(false, '', '');
								updateNavBarElements(false);
								updateTabElements(false);
							}
						);
					}
					
					if(!_isWaitingForSavingGameProperty && !_isWaitingForAbortSavingGameProperty){
							canSaveGameProperty();
					}
				}
			);
		}
	);
	
	/*
	 * convert integer to hexadecimal string 
	 * @param {data} data to be converted
	 * @param {sizeInByte} size of result in byte
	 */
	function convertIntStringToHexString(data, sizeInByte)
	{
		var hex = parseInt(data).toString(16);
		var totalLength = 2 * sizeInByte;
		
		// 1 byte = 2 paddings, i.e 00 or 0F or 1A
		while(hex.length < totalLength)
		{
			hex = "0" + hex;
		}
		
		// truncate extra byte
		if (hex.length > totalLength)
		{
			var startIndex = hex.length - totalLength;
			var endIndex = hex.length;
			hex = hex.substring(startIndex, endIndex);
		}
		
		return hex;
	}
	
	/*
	 * create and show modal
	 * @param {string} title
	 * @param {string} contentMsg
	 * @param {callback function} callbackYes
	 * @param {callback function} callbackNo
	 * @param {string} btnYesLabel
	 * @param {string} btnNoLabel
	 * @param {string} headerColor
	 */
	function showModal(title, contentMsg, callbackYes, callbackNo, btnYesLabel, btnNoLabel, headerColor){
		createModal(title, contentMsg, btnYesLabel, btnNoLabel, headerColor);
		$('div.modal').modal(callbackYes, callbackNo);
	}

	/*
	 * create modal
	 * @param {string} title
	 * @param {string} content
	 * @param {string} btnYes
	 * @param {string} btnNo
	 * @param {string} headerColor
	 */
	function createModal(title, content, btnYes, btnNo, headerColor){
		var dialogHTML = '<div class="modal-container">';
			dialogHTML += '<div class="modal fade">';
			dialogHTML += '<div class="modal-dialog modal-sm">';
			dialogHTML += '<div class="modal-content">';
			dialogHTML += '<div class="modal-header">';
			dialogHTML += '<h4 class="modal-title">'+title+'</h4>';
			dialogHTML += '</div>';
			dialogHTML += '<div class="modal-body">';
			dialogHTML += content;
			dialogHTML += '</div>';
			dialogHTML += '<div class="modal-footer">';
			if(btnNo != ''){
				dialogHTML += '<button type="button" class="btn btn-white btn-no" data-dismiss="modal">'+btnNo+'</button>';
			}

			if(btnYes != ''){
				dialogHTML += '<button type="button" class="btn btn-yes">'+btnYes+'</button>';
			}
			dialogHTML += '</div>';
			dialogHTML += '</div>';
			dialogHTML += '</div>';
			dialogHTML += '</div>';
			dialogHTML += '</div>';
		
		var backdrop = '<div class="modal-backdrop"></div>';
		$('body').append(backdrop);
		$('body').append(dialogHTML);
		$('div.modal-header').css('background-color', headerColor);
	}
</script>
